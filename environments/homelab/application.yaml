apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/visys-dev/n8n-hosting.git
    targetRevision: main
    path: charts/n8n
    helm:
      valueFiles:
        - ../../environments/homelab/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: n8n

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true